<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Verifica tu email</title></head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding: 40px 0;">
    <tr><td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius: 12px; overflow: hidden;">
        <tr>
          <td style="background-color:#0f1115; padding: 24px 32px;">
            <img src="cid:logo" alt="Ridei" width="120" style="display:block;">
          </td>
        </tr>
        <tr>
          <td style="padding: 32px;">
            <h1 style="margin: 0 0 16px; font-size: 20px; color:#111827;">Confirma tu email</h1>
            <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5; color:#4b5563;">
              Gracias por registrarte en Ridei. Confirma tu dirección de email para poder continuar.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 auto 24px;">
              <tr>
                <td style="border-radius: 8px; background-color:#0f1115;">
                  <a th:href="${verificationLink}" href="#" style="display:inline-block; padding: 14px 28px; font-size: 15px; font-weight: 600; color:#ffffff; text-decoration:none;">
                    Verificar mi email
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin: 0 0 8px; font-size: 13px; color:#9ca3af;">Este enlace caduca en 24 horas.</p>
            <p style="margin: 0; font-size: 13px; color:#9ca3af;">Si no has creado una cuenta en Ridei, ignora este correo.</p>
          </td>
        </tr>
        <tr>
          <td style="padding: 20px 32px; background-color:#f4f4f7;">
            <p style="margin:0; font-size:12px; color:#9ca3af; text-align:center;">&copy; Ridei. No respondas a este correo.</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
