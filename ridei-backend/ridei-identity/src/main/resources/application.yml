spring:
  application:
    name: ridei-identity
  datasource:
    url: jdbc:postgresql://localhost:5432/ridei_identity
    username: ridei
    password: ridei_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

server:
  port: 8081

google:
  client-id: ${GOOGLE_CLIENT_ID:287369655552-do09vcbkd0kt2deculk72i1t78fbqdc7.apps.googleusercontent.com}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000