spring:
  application:
    name: ridei-identity
  datasource:
    url: jdbc:postgresql://localhost:5432/ridei_identity
    username: ridei
    password: ridei_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

google:
  client-id: ${GOOGLE_CLIENT_ID:287369655552-do09vcbkd0kt2deculk72i1t78fbqdc7.apps.googleusercontent.com}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET:ridei-identity}
    public-base-url: ${R2_PUBLIC_BASE_URL}

mail:
  from-address: ${MAIL_FROM_ADDRESS:no-reply@rideiapp.com}
