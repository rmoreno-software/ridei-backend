spring:
  application:
    name: ridei-identity
  datasource:
    url: jdbc:postgresql://localhost:5432/ridei_identity
    username: ridei
    password: ridei_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081