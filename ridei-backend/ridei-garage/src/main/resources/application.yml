spring:
  application:
    name: ridei-garage
  datasource:
    url: ${GARAGE_DB_URL}
    username: ${GARAGE_DB_USERNAME}
    password: ${GARAGE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

jwt:
  public-key: ${JWT_PUBLIC_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cloudflare:
  r2:
    account-id: ${GARAGE_R2_ACCOUNT_ID}
    access-key: ${GARAGE_R2_ACCESS_KEY}
    secret-key: ${GARAGE_R2_SECRET_KEY}
    bucket: ${GARAGE_R2_BUCKET}
    public-base-url: ${GARAGE_R2_PUBLIC_BASE_URL}
