services:
  # --- DATABSE (PostgreSQL + PostGIS) ---
  db:
    image: postgis/postgis:16-3.4 # Version with pre-installed geographic extensions
    container_name: ridei_db
    restart: always
    environment:
      POSTGRES_USER: ridei_user
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: ridei_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- GRAPHICAL INTERFACE FOR THE DATABASE (pgAdmin) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: rodadas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ridei.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  # --- KAFKA (Single broker for development) ---
  kafka:
    image: apache/kafka:3.7.0
    container_name: ridei_kafka
    ports:
      - "9092:9092"
    environment:
      # Basic configuration for local development
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # --- UI FOR KAFKA (Optional, to view messages) ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ridei_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

volumes:
  postgres_data: