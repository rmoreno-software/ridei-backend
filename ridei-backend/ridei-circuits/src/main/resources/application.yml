spring:
  application:
    name: ridei-circuits
  datasource:
    url: ${CIRCUITS_DB_URL}
    username: ${CIRCUITS_DB_USERNAME}
    password: ${CIRCUITS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8083

jwt:
  public-key: ${JWT_PUBLIC_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Reglas de deduplicación de venues: un venue propuesto a menos de venue-radius-km de otro
# con similitud de nombre (trigramas, 0..1) >= venue-min-similarity es un posible duplicado.
circuits:
  deduplication:
    venue-radius-km: 2
    venue-min-similarity: 0.4
